<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 영단어장</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --hidden-bg: #f5f5f5;
            --hidden-text: #aaaaaa;
            --modal-overlay: rgba(0, 0, 0, 0.6);
            --danger-color: #ff4757; /* 삭제 버튼용 빨간색 */
        }

        body.dark-mode {
            --bg-color: #000000;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --hidden-bg: #222222;
            --hidden-text: #555555;
            --modal-overlay: rgba(255, 255, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 상단 버튼들 */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        
        .controls button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 페이지 표시기 */
        .page-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 100;
            transition: 0.3s;
            opacity: 0.8;
        }

        /* 스크롤 영역 */
        .shorts-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .shorts-container::-webkit-scrollbar { display: none; }

        /* 카드 및 텍스트 박스 */
        .card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            position: relative;
        }

        .text-box {
            text-align: center;
            cursor: pointer;
            padding: 20px 40px;
            border-radius: 12px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .text-box .content { font-size: 3.5rem; font-weight: bold; display: block; }
        .text-box .hint { font-size: 1.2rem; font-weight: normal; color: var(--hidden-text); display: none; }
        .text-box.hidden { background-color: var(--hidden-bg); }
        .text-box.hidden .content { display: none; }
        .text-box.hidden .hint { display: block; }

        /* 카드 하단의 수정 버튼 */
        .edit-btn {
            background: none;
            border: 1px solid var(--hidden-text);
            color: var(--hidden-text);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .edit-btn:hover { background-color: var(--hidden-bg); }

        /* --- 단어 추가/수정 팝업(모달) 스타일 --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--modal-overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        .modal {
            background-color: var(--bg-color);
            padding: 30px;
            border-radius: 16px;
            width: 80%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .modal h3 { margin: 0; text-align: center; font-size: 1.2rem; }
        .modal input {
            padding: 12px;
            border: 1px solid var(--hidden-text);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }
        .modal input:focus { border-color: var(--text-color); }
        .modal-btns { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
        .modal-btns button {
            flex: 1; padding: 10px; border-radius: 8px;
            border: none; font-weight: bold; cursor: pointer;
        }
        .btn-cancel { background-color: var(--hidden-bg); color: var(--text-color); }
        .btn-save { background-color: var(--btn-bg); color: var(--btn-text); }
        .btn-delete { background-color: var(--danger-color); color: white; display: none; }

    </style>
</head>
<body>

    <div class="controls">
        <button onclick="openModal()">+ 단어 추가</button>
        <button onclick="toggleDarkMode()">다크모드</button>
        <button onclick="toggleFullScreen()">전체화면</button>
    </div>

    <div class="page-indicator" id="pageInfo">0 / 0</div>

    <div class="shorts-container" id="appContainer"></div>

    <!-- 팝업 모달창 -->
    <div class="modal-overlay" id="wordModal">
        <div class="modal">
            <h3 id="modalTitle">새 단어 등록</h3>
            <input type="text" id="inputEn" placeholder="영단어 (예: Apple)" autocomplete="off">
            <input type="text" id="inputKo" placeholder="뜻 (예: 사과)" autocomplete="off">
            <div class="modal-btns">
                <button id="btnDelete" class="btn-delete" onclick="deleteWord()">삭제</button>
                <button class="btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn-save" onclick="saveWord()">저장</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('appContainer');
        const pageInfo = document.getElementById('pageInfo');
        
        let wordList = JSON.parse(localStorage.getItem('myWordList'));
        if (!wordList || wordList.length === 0) {
            wordList = [
                { en: "Coincidence", ko: "우연의 일치" },
                { en: "Fascinating", ko: "매력적인" },
                { en: "Determine", ko: "결정하다" }
            ];
            localStorage.setItem('myWordList', JSON.stringify(wordList));
        }

        let totalWords = wordList.length;

        function renderWords() {
            observer.disconnect();
            container.innerHTML = '';
            totalWords = wordList.length;

            // 단어가 하나도 없을 때의 처리
            if (totalWords === 0) {
                container.innerHTML = `<div class="card" style="font-size:1.5rem; font-weight:bold;">단어가 없습니다.<br>우측 상단에서 추가해주세요!</div>`;
                pageInfo.innerText = `0 / 0`;
                return;
            }

            wordList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="text-box" onclick="this.classList.toggle('hidden')">
                        <span class="content">${item.en}</span>
                        <span class="hint">터치하여 단어 보기</span>
                    </div>
                    <div class="text-box hidden" onclick="this.classList.toggle('hidden')">
                        <span class="content">${item.ko}</span>
                        <span class="hint">터치하여 뜻 보기</span>
                    </div>
                    <!-- 단어 밑에 조그맣게 들어가는 수정 버튼 -->
                    <button class="edit-btn" onclick="openModal(${index})">수정 / 삭제</button>
                `;
                container.appendChild(card);
                observer.observe(card);
            });
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const currentIndex = parseInt(entry.target.dataset.index);
                    if(!isNaN(currentIndex)) {
                        pageInfo.innerText = `${currentIndex + 1} / ${totalWords}`;
                        // 스크롤 할 때마다 현재 위치를 브라우저에 저장
                        localStorage.setItem('lastViewedWordIndex', currentIndex);
                    }
                }
            });
        }, { threshold: 0.5 });


        // --- 모달 (단어 추가/수정/삭제) 로직 ---
        const modal = document.getElementById('wordModal');
        const modalTitle = document.getElementById('modalTitle');
        const inputEn = document.getElementById('inputEn');
        const inputKo = document.getElementById('inputKo');
        const btnDelete = document.getElementById('btnDelete');
        let editingIndex = -1; // -1이면 '새로 추가', 0 이상이면 '수정 중'

        // 팝업 열기 (index가 없으면 새 단어, 있으면 수정)
        function openModal(index = -1) {
            editingIndex = index;
            modal.style.display = 'flex';

            if (index === -1) {
                modalTitle.innerText = "새 단어 등록";
                inputEn.value = '';
                inputKo.value = '';
                btnDelete.style.display = 'none'; // 새 단어 등록할 땐 삭제버튼 숨김
            } else {
                modalTitle.innerText = "단어 수정";
                inputEn.value = wordList[index].en;
                inputKo.value = wordList[index].ko;
                btnDelete.style.display = 'block'; // 수정할 땐 삭제버튼 표시
            }
            inputEn.focus();
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveWord() {
            const enText = inputEn.value.trim();
            const koText = inputKo.value.trim();

            if (enText === '' || koText === '') {
                alert("영단어와 뜻을 모두 입력해주세요!");
                return;
            }

            if (editingIndex === -1) {
                // 새 단어 추가
                wordList.push({ en: enText, ko: koText });
            } else {
                // 기존 단어 수정
                wordList[editingIndex] = { en: enText, ko: koText };
            }
            
            saveAndReload();

            // 새로 추가한 경우엔 맨 마지막으로 부드럽게 이동
            if(editingIndex === -1) {
                setTimeout(() => scrollToTarget(wordList.length - 1, 'smooth'), 100);
            }
        }

        function deleteWord() {
            if(confirm("정말 이 단어를 삭제하시겠습니까?")) {
                wordList.splice(editingIndex, 1); // 배열에서 삭제
                saveAndReload();
                // 삭제 후 이전 단어로 스크롤 맞춤
                const targetIndex = Math.max(0, editingIndex - 1);
                setTimeout(() => scrollToTarget(targetIndex, 'auto'), 100);
            }
        }

        // 로컬 스토리지에 저장하고 화면 다시 그리기
        function saveAndReload() {
            localStorage.setItem('myWordList', JSON.stringify(wordList));
            renderWords();
            closeModal();
        }

        // 특정 인덱스 카드로 스크롤 이동 함수
        function scrollToTarget(index, behavior) {
            const targetCard = document.querySelector(`.card[data-index="${index}"]`);
            if (targetCard) {
                container.scrollTo({ top: targetCard.offsetTop, behavior: behavior });
            }
        }


        // --- 앱 시작 및 부가 기능 ---
        function initApp() {
            renderWords();
            
            // 껐다 켜도 마지막으로 보던 곳에서 정확히 시작
            const savedIndex = localStorage.getItem('lastViewedWordIndex');
            if (savedIndex !== null && wordList.length > 0) {
                // 부드러운 스크롤 애니메이션 없이 즉시(auto) 그 위치에서 켜지도록 함
                scrollToTarget(savedIndex, 'auto');
            }
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert("전체화면 지원 안됨"));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        initApp();
    </script>

</body>
</html>
