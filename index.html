<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 영단어장</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --btn-bg: #000000;
            --btn-text: #ffffff;
            --hidden-bg: #f5f5f5;
            --hidden-text: #aaaaaa;
        }

        body.dark-mode {
            --bg-color: #000000;
            --text-color: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --hidden-bg: #222222;
            --hidden-text: #555555;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Pretendard', -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 상단 컨트롤 버튼 */
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }
        
        .controls button {
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 하단 페이지 표시기 */
        .page-indicator {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--btn-bg);
            color: var(--btn-text);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 100;
            transition: 0.3s;
            opacity: 0.8;
        }

        .shorts-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth; /* 부드러운 스크롤 이동 */
        }
        .shorts-container::-webkit-scrollbar {
            display: none;
        }

        .card {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .text-box {
            text-align: center;
            cursor: pointer;
            padding: 20px 40px;
            border-radius: 12px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .text-box .content {
            font-size: 3.5rem;
            font-weight: bold;
            display: block;
        }

        .text-box .hint {
            font-size: 1.2rem;
            font-weight: normal;
            color: var(--hidden-text);
            display: none;
        }

        .text-box.hidden {
            background-color: var(--hidden-bg);
        }
        .text-box.hidden .content {
            display: none;
        }
        .text-box.hidden .hint {
            display: block;
        }
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="toggleDarkMode()">다크모드</button>
        <button onclick="toggleFullScreen()">전체화면</button>
    </div>

    <!-- 몇 페이지인지 보여주는 부분 -->
    <div class="page-indicator" id="pageInfo">1 / 1</div>

    <!-- 자바스크립트가 단어들을 이 안에 자동으로 채워 넣을 예정입니다 -->
    <div class="shorts-container" id="appContainer"></div>

    <script>
        // 💡 1. 단어 추가는 여기서 하시면 됩니다!
        // 형식에 맞춰서 쉼표(,)로 구분하며 계속 늘려가면 자동으로 화면이 생성됩니다.
        const wordList = [
            { en: "Coincidence", ko: "우연의 일치" },
            { en: "Fascinating", ko: "매력적인" },
            { en: "Determine", ko: "결정하다" },
            { en: "Obvious", ko: "명백한" },
            { en: "Essential", ko: "필수적인" },
            { en: "Vulnerable", ko: "취약한" },
            { en: "Complicated", ko: "복잡한" }
        ];

        const container = document.getElementById('appContainer');
        const pageInfo = document.getElementById('pageInfo');
        const totalWords = wordList.length;

        // 2. 단어 목록을 바탕으로 화면(HTML)을 자동으로 그려주는 기능
        function renderWords() {
            wordList.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = index; // 페이지 번호 추적용 데이터

                // HTML 구조 만들기 (단어는 보이고, 뜻은 숨김 상태로 시작)
                card.innerHTML = `
                    <div class="text-box" onclick="this.classList.toggle('hidden')">
                        <span class="content">${item.en}</span>
                        <span class="hint">터치하여 단어 보기</span>
                    </div>
                    <div class="text-box hidden" onclick="this.classList.toggle('hidden')">
                        <span class="content">${item.ko}</span>
                        <span class="hint">터치하여 뜻 보기</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 3. 현재 화면에 어떤 단어가 보이는지 감지해서 페이지 표시 & 저장하는 기능
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                // 화면에 절반 이상(0.5) 보일 때
                if (entry.isIntersecting) {
                    const currentIndex = parseInt(entry.target.dataset.index);
                    
                    // 페이지 번호 업데이트 (인덱스는 0부터 시작하므로 +1)
                    pageInfo.innerText = `${currentIndex + 1} / ${totalWords}`;
                    
                    // 브라우저에 마지막으로 본 위치 저장
                    localStorage.setItem('lastViewedWordIndex', currentIndex);
                }
            });
        }, { threshold: 0.5 }); // 화면의 50%가 보일 때 작동

        // 앱 초기화 및 시작 설정
        function initApp() {
            renderWords(); // 단어 카드들 생성

            // 생성된 모든 카드를 관찰(Observe) 시작
            document.querySelectorAll('.card').forEach(card => observer.observe(card));

            // 저장된 마지막 위치 불러오기
            const savedIndex = localStorage.getItem('lastViewedWordIndex');
            
            if (savedIndex !== null) {
                // 약간의 딜레이를 주어 화면이 다 그려진 후 스크롤을 이동시킴
                setTimeout(() => {
                    const targetCard = document.querySelector(`.card[data-index="${savedIndex}"]`);
                    if (targetCard) {
                        // 저장된 위치로 스크롤 이동
                        container.scrollTo({
                            top: targetCard.offsetTop,
                            behavior: 'auto'
                        });
                    }
                }, 100);
            }
        }

        // 다크모드
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        // 전체화면
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => alert("전체화면 지원 안됨"));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 앱 실행!
        initApp();
    </script>

</body>
</html>
